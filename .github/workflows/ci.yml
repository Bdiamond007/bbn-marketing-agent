name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  APP_ENV: test
  APP_BASE_URL: http://localhost:3000
  ADAPTER_MODE: fake
  AUTH_MODE: fake

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://bbn_app:bbn_app_ci@localhost:5432/bbn
      DATABASE_MIGRATION_URL: postgres://bbn_migrator:bbn_migrator_ci@localhost:5432/bbn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: SQL / RLS (PostgreSQL réel)
        run: pnpm test:db
      - name: Contracts (simulateurs)
        run: pnpm test:contracts
      - name: Translations
        run: pnpm i18n:check
      - name: Dependency audit (prod, high+)
        run: pnpm audit --prod --audit-level high
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @bbn/web exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm test:e2e
