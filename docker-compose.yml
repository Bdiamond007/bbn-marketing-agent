# Infrastructure locale optionnelle (`pnpm dev:infra`). Valeurs de développement uniquement.
# Les tests unitaires/contrats n'en ont pas besoin (simulateurs en mémoire) ; test:db a seulement besoin
# de PostgreSQL (ce service, ou `pnpm pg:local` sans Docker).
# Les services S3/SQS/email simulés serviront aux adaptateurs « local-live » (E10/E12) ;
# tags d'images à revérifier au premier lancement (voir docs/execution/reports/E02_2026-11-11.md).
name: bbn-local
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]

  s3:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-dev
      MINIO_ROOT_PASSWORD: local-dev-password
    ports: ["9000:9000", "9001:9001"]
    volumes: ["s3data:/data"]

  queue:
    image: softwaremill/elasticmq-native:1.6.9
    ports: ["9324:9324", "9325:9325"]

  mail:
    image: axllent/mailpit:v1.20.5
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  s3data:
